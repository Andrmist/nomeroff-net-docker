version: '2.3'

services:
  ai-web:
    image: nginx
    restart: unless-stopped
    volumes:
      - ./ai_service/docker/web/app.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - $LISTEN:80

  ai-app:
    build:
      context: ai_service
      dockerfile: ./docker/app/Dockerfile
      args:
        NOMEROFF_NET_REV: master # e96221d1b9e93641d434185def9b301411db7b6f 
    command: waitress-serve --call 'main:create_app'
    working_dir: /var/www/app
    restart: unless-stopped
    # uncomment `runtime` to use GPU
    runtime: nvidia
    scale: 2
    volumes:
      - ./ai_service:/var/www/app
      - ./ai_service/models:/var/www/nomeroff-net/data/models
    environment:
      - TF_FORCE_GPU_ALLOW_GROWTH=true
    logging:
       driver: "json-file"
       options:
         max-size: "10m"
         max-file: "5"

  backend:
    build: backend
    ports:
      - 3002:8080
    volumes:
      - ./config.json:/app/config.json
    restart: unless-stopped
    depends_on:
      - ai-app
      - ai-web
