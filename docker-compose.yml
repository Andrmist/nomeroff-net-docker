version: '2.3'

services:

  web:
    image: nginx
    restart: unless-stopped
    volumes:
      - ./docker/web/app.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - $LISTEN:80
    depends_on:
      app:
        condition: service_healthy

  app:
    build:
      context: docker/app
      args:
        NOMEROFF_NET_REV: master # e96221d1b9e93641d434185def9b301411db7b6f 
    command: waitress-serve --call 'main:create_app'
    working_dir: /var/www/app
    restart: unless-stopped
    # uncomment `runtime` to use GPU
    runtime: nvidia
    healthcheck:
      test: "curl http://localhost:8080/alive"
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    deploy:
      mode: replicated
      replicas: 4
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    volumes:
      - ./:/var/www/app
      - ./models:/var/www/nomeroff-net/data/models
    environment:
      - TF_FORCE_GPU_ALLOW_GROWTH=true
    logging:
       driver: "json-file"
       options:
         max-size: "10m"
         max-file: "5"
